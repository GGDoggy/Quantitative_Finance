[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-finance"
version = "0.1.0"
description = "Coinbase market-data collection, preprocessing, dashboard, and simulation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiocsv",
  "aiofiles",
  "bokeh",
  "coinbase_advanced_py==1.8.2",
  "datashader",
  "holoviews",
  "matplotlib==3.10.8",
  "numpy",
  "pandas",
  "panel",
  "plotly",
]

[project.scripts]
qf-simulation = "src.simulation.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
