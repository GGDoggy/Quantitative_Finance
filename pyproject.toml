[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-finance"
version = "0.0.0"
description = "Coinbase market-data collection, preprocessing, plotting, and simulation tools."
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*", "src*", "server*"]
